<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R.U.D.I. Control Plane</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <h1>R.U.D.I. Dashboard</h1>
        <div id="system-status" class="status-badge">Connecting...</div>
      </header>

      <section id="metrics" class="card">
        <h2>System Metrics</h2>
        <div class="metrics-grid">
          <div class="metric"><span>Requests:</span> <b id="m-requests">0</b></div>
          <div class="metric"><span>Grants:</span> <b id="m-grants">0</b></div>
          <div class="metric"><span>Denials:</span> <b id="m-denials">0</b></div>
          <div class="metric"><span>Uses:</span> <b id="m-uses">0</b></div>
          <div class="metric"><span>Blocked:</span> <b id="m-blocked">0</b></div>
          <div class="metric"><span>ID Failures:</span> <b id="m-id-failures" class="danger">0</b></div>
        </div>
      </section>

      <section id="active-grants" class="card">
        <h2>Active Grants</h2>
        <table id="grants-table">
          <thead>
            <tr>
              <th>Agent</th>
              <th>Capability</th>
              <th>Expiry</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated via TS -->
          </tbody>
        </table>
      </section>

      <!-- Approval Modal -->
      <div id="approval-modal" class="modal hidden">
        <div class="modal-content">
          <h3>Capability Request Approval</h3>
          <div id="request-details">
             <!-- Populated via TS -->
          </div>
          <div class="modal-actions">
            <button id="btn-deny" class="btn-danger">Deny</button>
            <div class="approve-group">
              <select id="grant-type">
                <option value="allow_once">Allow Once</option>
                <option value="session">Session (1h)</option>
                <option value="permanent">Permanent</option>
              </select>
              <button id="btn-approve" class="btn-success">Approve</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
