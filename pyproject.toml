[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rudi"
version = "0.1.0"
description = "Responsible User-Delegated Interface (R.U.D.I.) - A capability-based mediation layer for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "kb", email = "kb@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "prometheus-client>=0.17.0",
    "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://github.com/your-repo/rudi"

[project.scripts]
rudi-server = "core.control_plane.server:main"
